name: Build ToadClient

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build with MSBuild
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        msbuild ToadClient.sln /p:Configuration=Release /p:Platform="x64" /p:LanguageStandard=stdcpp17 /p:WindowsTargetPlatformVersion=10.0 /p:BuildInParallel=false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ToadClient-Build
        path: x64/Release/ # Zkontroluj, jestli se ti to po buildu uloží sem, případně uprav cestu